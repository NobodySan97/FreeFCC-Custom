name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SIGNING_STORE_FILE: ${{ github.workspace }}/release.jks
      SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check signing secrets are present
        id: secrets
        run: |
          if [ -z "$SIGNING_KEYSTORE_B64" ] || [ -z "$SIGNING_STORE_PASSWORD" ] || [ -z "$SIGNING_KEY_ALIAS" ] || [ -z "$SIGNING_KEY_PASSWORD" ]; then
            echo "have_secrets=false" >> "$GITHUB_OUTPUT"
            echo "Warning: signing secrets not configured — skipping signed build." >&2
          else
            echo "have_secrets=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode keystore
        if: steps.secrets.outputs.have_secrets == 'true'
        run: echo "$SIGNING_KEYSTORE_B64" | base64 --decode > "$SIGNING_STORE_FILE"

      - name: Build and Test
        run: ./gradlew assembleRelease testDebugUnitTest

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish APK to the release
        if: startsWith(github.ref, 'refs/tags/v') && steps.secrets.outputs.have_secrets == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then APK="$(ls app/build/outputs/apk/release/*.apk | head -1)"; fi
          
          NEW_APK="FreeFCC-Custom-${GITHUB_REF_NAME}.apk"
          mv "$APK" "$NEW_APK"
          
          echo "Publishing $NEW_APK to release ${GITHUB_REF_NAME}"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "$NEW_APK" --clobber
          else
            if [[ "${GITHUB_REF_NAME}" == *"-beta"* ]]; then
              gh release create "${GITHUB_REF_NAME}" "$NEW_APK" --title "${GITHUB_REF_NAME}" --generate-notes --prerelease
            else
              gh release create "${GITHUB_REF_NAME}" "$NEW_APK" --title "${GITHUB_REF_NAME}" --generate-notes
            fi
          fi